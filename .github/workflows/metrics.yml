# Renders github-metrics.svg from live GitHub data (lowlighter/metrics).
# Nothing in the dashboard is hand-typed: every number comes from the API on each run.
# Runs zannn123/metrics@patched: upstream v3.34 plus two fixes (habits crash, Spotify playlist parsing).
#
# Setup (one time, repo settings):
#   Secret   METRICS_TOKEN    classic PAT with repo, read:user
#   Variable MUSIC_PLAYLIST   Spotify playlist embed URL
#   Secret   PAGESPEED_TOKEN  Google PageSpeed API key (panel is off until it exists)
name: Metrics

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 Asia/Manila
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Render github-metrics.svg
        uses: zannn123/metrics@patched
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: zannn123
          filename: github-metrics.svg

          # Layout
          template: classic
          config_display: columns
          config_timezone: Asia/Manila
          config_octicon: yes
          config_twemoji: yes
          config_animations: yes
          plugins_errors_fatal: no

          # Profile, repositories, community, metadata
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_forks: no

          # Contributions calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Language activity (private repos counted, names never shown)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github

          # Coding habits and recent activity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_facts: yes

          # Mastered technologies and topics (topics starred on github.com/topics)
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: stars

          # PageSpeed Insights of the live profile site.
          # Off until the PAGESPEED_TOKEN secret exists: the keyless shared quota is exhausted (HTTP 429).
          plugin_pagespeed: no
          plugin_pagespeed_url: https://zannn123.github.io/zannn123/
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_detailed: no

          # Suggested tracks from a public Spotify playlist
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: playlist
          plugin_music_playlist: ${{ vars.MUSIC_PLAYLIST }}
          plugin_music_limit: 4
